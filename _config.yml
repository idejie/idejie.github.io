# sitemap
# 提交给谷歌搜素引擎,SEO优化开启配置是一样的
sitemap:
    path: sitemap.xml
# 提交百度搜索引擎   
baidusitemap:
    path: baidusitemap.xml 

# HTML压缩
html_minifier:
  exclude:     
# css压缩
clean_css:
  exclude: 
    - '*.min.css'
# js压缩   
uglify:
  mangle: true
  output:
  compress:
  exclude: 
    - '*.min.js'
# image压缩    
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 杨德杰
subtitle: blog.idejie.com
description: 杨德杰的个人博客
author: 杨德杰
language: zh-CN
timezone:

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://blog.idejie.com
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link: true # Open external links in new tab
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: false
  # auto_detect: true
  # tab_replace:
# Category & Tag
default_category: 
category_map:
tag_map:

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: fexo
# Security
##
encrypt:
    enable: true
    
baidu_url_submit:
  count: 1000 ## 比如3，代表提交最新的三个链接
  host: blog.idejie.com ## 在百度站长平台中注册的域名
  token: STeMcLVkCXx3OO76 ## 请注意这是您的秘钥， 请不要发布在公众仓库里!
  path: baidu_urls.txt ## 文本文档的地址， 新链接会保存在此文本文档里

#url

# Deployment
## Docs: https://hexo.io/docs/deployment.html
# deploy:
#   type: git
#   repo: https://github.com/yangdejie/yangdejie.github.io
#   branch: master
deploy:
  type: baidu_url_submitter